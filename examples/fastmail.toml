# ~/.config/imapvault/personal.toml, used with: imapvault --account personal ...
[imap]
host = "imap.fastmail.com"
port = 993
username = "you@example.com"
# The password never goes in this file. Use one of:
password_command = "op read op://Personal/fastmail-imapvault/password"
# password_file = "/run/secrets/imapvault"
# or the environment: IMAPVAULT_IMAP_PASSWORD[_<ACCOUNT>]

[repository]
path = "/volume1/backup/imapvault/personal"

[folders]
include = ["*"]
exclude = ["Spam", "Junk"]

[retention]
keep_last    = 3
keep_hourly  = 24
keep_daily   = 14
keep_weekly  = 8
keep_monthly = 24
keep_yearly  = 10
deleted_grace = "180d"   # mail gone from the server stays restorable at least this long

[guard]
max_deleted_percent = 10   # of messages in the previous snapshot; 0 turns it off
max_deleted_count   = 500  # 0 turns it off
on_alert = "/usr/local/bin/notify-me 'imapvault alert: {account} {summary}'"
