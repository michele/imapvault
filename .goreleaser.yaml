# Release binaries (`make release-snapshot` builds them locally without publishing;
# .github/workflows/release.yml publishes on a v* tag). Pure Go, no CGO.
# Windows is not built: the repository lock uses flock(2), which is Unix only.
version: 2
project_name: imapvault

builds:
  - id: imapvault
    main: ./cmd/imapvault
    binary: imapvault
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Tag }} -X main.commit={{ .FullCommit }} -X main.date={{ slice .CommitDate 0 10 }}

archives:
  - id: imapvault
    formats: [tar.gz]
    name_template: "imapvault_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - SECURITY.md
      - examples/*
      - docs/SCHEDULING.md
      - docs/DEPLOY.md
      - src: deploy/systemd/*.service
        dst: deploy/systemd
      - src: deploy/systemd/*.timer
        dst: deploy/systemd
      # A src without a wildcard is copied to dst as that exact name, so dst is the
      # file path here (a directory name would replace deploy/systemd itself).
      - src: deploy/systemd/imapvault.sysusers
        dst: deploy/systemd/imapvault.sysusers
      - src: deploy/systemd/user/*
        dst: deploy/systemd/user
      # The compose bundle (docs/DEPLOY.md). The build and test overrides need a checkout, so they stay out.
      - src: deploy/docker-compose.yml
        dst: deploy/docker-compose.yml
      - src: deploy/.env.example
        dst: deploy/.env.example
      - src: deploy/imapvault.example.toml
        dst: deploy/imapvault.example.toml
      - src: deploy/secrets/README.md
        dst: deploy/secrets/README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^fix'
      order: 1
    - title: Everything else
      order: 2
  filters:
    exclude:
      - '^test'
      - '^chore'
      - '^Merge'

# Homebrew formula, pushed to michele/homebrew-imapvault by the release workflow.
# The release itself is a draft until you publish it, so `brew install` fails
# (404 on the archives) between the tag and the publish; publish promptly.
# Needs HOMEBREW_TAP_GITHUB_TOKEN (see docs/RELEASING.md).
brews:
  - name: imapvault
    repository:
      owner: michele
      name: homebrew-imapvault
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    url_template: "https://github.com/michele/imapvault/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    homepage: https://imapvault.sh
    description: "IMAP backup with point-in-time snapshots, mass-deletion alerts and restore"
    license: MIT
    test: |
      assert_match version.to_s, shell_output("#{bin}/imapvault --version")
    commit_msg_template: "imapvault {{ .Tag }}"

# The release is created as a draft: read it, then publish it by hand.
release:
  github:
    owner: michele
    name: imapvault
  draft: true
  prerelease: auto
