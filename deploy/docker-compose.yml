# imapvault in Docker: backups for ONE mailbox account. Two services:
#
#   run        always on. `docker compose up -d` starts it: it backs up every hour, applies the retention
#              policy ("forget") daily, optionally prunes, and notifies you when the mass-deletion guard
#              trips or backups keep failing.
#   imapvault  the CLI, for everything else. `docker compose run --rm imapvault <command>`, with the
#              account already set; the container exits when the command does.
#
# See docs/DEPLOY.md.
#
#   cp .env.example .env                          # set PUID/PGID (`id` on the NAS) and IMAPVAULT_ACCOUNT
#   mkdir -p config repo secrets && chmod 700 repo
#   cp imapvault.example.toml config/fastmail.toml   # edit it; the file name is the account name
#   (write the IMAP app password to secrets/imap_password, see secrets/README.md)
#   docker compose run --rm imapvault init        # once; creates the repository
#   docker compose run --rm imapvault backup      # the first run can take hours; the live bar shows progress
#   docker compose up -d                          # then let imapvault schedule itself
#   docker compose logs -f -t run                 # what it is doing
#
# Other commands, the same way (any imapvault command and its flags):
#   docker compose run --rm imapvault snapshots          docker compose run --rm imapvault prune --dry-run
#   docker compose run --rm imapvault forget             docker compose run --rm imapvault check --read-data
#   docker compose run --rm imapvault --account work snapshots      (another account: the last --account wins)
#
# The config folder is mounted at /config/imapvault because that is where `--account NAME` looks
# (the image sets XDG_CONFIG_HOME=/config). On the host the file is simply ./config/NAME.toml.
#
# Build the image from this checkout instead of pulling it (and set IMAPVAULT_IMAGE=imapvault:local in .env):
#   docker compose -f docker-compose.yml -f docker-compose.build.yml build run
name: imapvault-deploy

x-imapvault: &imapvault
  image: ${IMAPVAULT_IMAGE:-ghcr.io/michele/imapvault:latest}
  # Must be able to read secrets/imap_password and write repo/: use the uid/gid that owns them on the
  # host (`id` on the NAS), see docs/DEPLOY.md.
  user: "${PUID:-65532}:${PGID:-65532}"
  environment:
    TZ: ${TZ:-UTC}
    # Go does not size its heap to the cgroup limit: keep it under mem_limit.
    GOMEMLIMIT: 700MiB
  volumes:
    - ./config:/config/imapvault:ro
    # The repository (blobs and the SQLite index). Must be a LOCAL filesystem: the repository lock
    # uses flock(2), which is unreliable on NFS/SMB.
    - ./repo:/repo
  secrets:
    - source: imap_password
      target: imap_password # -> /run/secrets/imap_password
  # A command that fails is not retried by Docker. (`run` overrides this.)
  restart: "no"
  read_only: true
  # Scratch space in RAM; nothing imapvault keeps is written here.
  tmpfs:
    - /tmp:size=64m
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  # SIGTERM stops a backup cleanly: what was downloaded is kept and the next one continues from it.
  stop_grace_period: 60s
  mem_limit: 1g
  pids_limit: 128
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# `entrypoint` (not `command`) fixes what runs, so anything you type after the service name is appended to
# it instead of replacing it. (`run` keeps its flags from .env in `command`, so typing flags after `run`
# replaces them; it is not meant to be run by hand.)
services:
  # The default: what `docker compose up -d` starts. The intervals come from .env. A backup that fails is
  # retried by imapvault itself; Docker only restarts the container if the process exits, which it does
  # at once when the config or repository cannot be opened (so a bad setup shows as a restart loop).
  run:
    <<: *imapvault
    restart: unless-stopped
    entrypoint: ["/imapvault", "--account", "${IMAPVAULT_ACCOUNT:?set IMAPVAULT_ACCOUNT in .env}", "run"]
    command:
      - --every=${IMAPVAULT_EVERY:-1h}
      - --forget-every=${IMAPVAULT_FORGET_EVERY:-24h}
      - --prune-every=${IMAPVAULT_PRUNE_EVERY:-0}
      - --stale-after=${IMAPVAULT_STALE_AFTER:-24h}

  # Every other command. It is in the "tools" profile, so `up` leaves it alone and it starts only when you
  # name it. The account is preset; give another one after it (`--account work`) and that one wins.
  # Between `run`'s jobs this works as usual; during one it fails at once, naming who holds the lock.
  # Look before you prune: `docker compose run --rm imapvault prune --dry-run`.
  imapvault:
    <<: *imapvault
    profiles: [tools]
    entrypoint: ["/imapvault", "--account", "${IMAPVAULT_ACCOUNT:?set IMAPVAULT_ACCOUNT in .env}"]

secrets:
  imap_password:
    file: ./secrets/imap_password
